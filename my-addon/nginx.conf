events {}

http {
    include       /etc/nginx/mime.types; # สำคัญ: เพื่อให้ Browser รู้จักไฟล์ CSS
    default_type  application/octet-stream;

    server {
        listen 8080;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
            # บรรทัดข้างล่างนี้จะช่วยให้หาไฟล์เจอไม่ว่าจะเข้าผ่าน Path ไหน
            try_files $uri $uri/ /index.html;
        }
    }
}